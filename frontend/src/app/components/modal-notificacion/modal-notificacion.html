@if (notificacion.state$ | async; as state) {
    @if (state.show) {
        <!-- Fondo oscuro superpuesto (Backdrop) -->
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">

            <!-- Contenedor del Modal -->
            <div class="relative w-full max-w-md p-6 bg-white rounded-lg shadow-xl"
                 [ngClass]="{
             'border-t-4 border-blue-500': state.type === 'info',
             'border-t-4 border-yellow-500': state.type === 'warning',
             'border-t-4 border-red-500': state.type === 'error'
           }">

                <!-- Título dinámico -->
                <h3 class="text-lg font-bold mb-3"
                    [ngClass]="{
              'text-blue-600': state.type === 'info',
              'text-yellow-600': state.type === 'warning',
              'text-red-600': state.type === 'error'
            }">
                    @switch (state.type) {
                        @case ('info') { <span>Información</span> }
                        @case ('warning') { <span>Advertencia</span> }
                        @case ('error') { <span>Error</span> }
                    }
                </h3>

                <!-- Mensaje -->
                <p class="text-gray-700 mb-6">{{ state.message }}</p>

                <!-- Botón de acción -->
                <div class="flex justify-end">
                    <button (click)="notificacion.close()"
                            class="px-4 py-2 text-white rounded font-medium focus:outline-none transition-colors"
                            [ngClass]="{
                    'bg-blue-500 hover:bg-blue-600': state.type === 'info',
                    'bg-yellow-500 hover:bg-yellow-600': state.type === 'warning',
                    'bg-red-500 hover:bg-red-600': state.type === 'error'
                  }">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    }
}
