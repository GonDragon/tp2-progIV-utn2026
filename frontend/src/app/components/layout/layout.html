<div class="layout-container">

    <!-- Banner superior estilo Barra de Título Windows XP -->
    <header class="xp-titlebar layout-header">
        <div class="xp-titlebar-title">
            <div class="layout-app-icon">
                <span>🐾</span>
            </div>
            <h1 class="layout-app-title">
                Patitas - Red Social
            </h1>
        </div>

        <!-- Botones decorativos de ventana -->
        <div class="xp-window-controls">
            <span class="xp-win-btn xp-win-btn-default">_</span>
            <span class="xp-win-btn xp-win-btn-default">□</span>
            <span class="xp-win-btn xp-win-btn-close">✕</span>
        </div>
    </header>

    <!-- Contenido de la página dentro del escritorio / ventana principal -->
    <main class="layout-main">
        <!-- El router-outlet renderiza las páginas según la ruta -->
        <router-outlet></router-outlet>
    </main>

    <!-- Barra inferior de navegación estilo Barra de Tareas (Taskbar) de Windows XP -->
    <nav class="xp-taskbar layout-nav">
        <ul class="layout-nav-list">
            <li class="layout-nav-item">
                <a routerLink="/registro"
                   routerLinkActive="active"
                   class="xp-task-button">
                    <span>Registro</span>
                </a>
            </li>
            <li class="layout-nav-item">
                <a routerLink="/login"
                   routerLinkActive="active"
                   class="xp-task-button">
                    <span>Login</span>
                </a>
            </li>
            <li class="layout-nav-item">
                <a routerLink="/perfil"
                   routerLinkActive="active"
                   class="xp-task-button">
                    <span>Perfil</span>
                </a>
            </li>
            <li class="layout-nav-item">
                <a routerLink="/publicaciones"
                   routerLinkActive="active"
                   class="xp-task-button">
                    <span>Publicaciones</span>
                </a>
            </li>
        </ul>
    </nav>

</div>
