<article class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 transition-all duration-200 hover:shadow-md flex flex-col justify-between">
  <div>
    <!-- Cabecera de la publicación -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-3">
        <!-- Avatar placeholder -->
        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
          {{ autorNombre.charAt(0).toUpperCase() }}
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-900">{{ autorNombre }}</h3>
          <p class="text-xs text-gray-500">
            <span *ngIf="autorUsername" class="mr-1">&#64;{{ autorUsername }} &bull;</span>
            <span>{{ publicacion.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
          </p>
        </div>
      </div>

      <!-- Botón Eliminar (solo autor o admin) -->
      <button
        *ngIf="puedeEliminar"
        type="button"
        (click)="confirmarEliminar()"
        class="text-gray-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition-colors"
        title="Eliminar publicación"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>

    <!-- Título -->
    <h2 class="text-lg font-bold text-gray-900 mb-2 leading-snug">
      {{ publicacion.titulo }}
    </h2>

    <!-- Contenido -->
    <p class="text-gray-700 text-sm whitespace-pre-line mb-4 leading-relaxed">
      {{ publicacion.contenido }}
    </p>

    <!-- Imagen (si existe) -->
    <div *ngIf="publicacion.url_imagen" class="mb-4 overflow-hidden rounded-lg border border-gray-100 bg-gray-50">
      <img
        [src]="publicacion.url_imagen"
        [alt]="publicacion.titulo"
        class="w-full max-h-80 object-cover"
        loading="lazy"
      />
    </div>
  </div>

  <!-- Footer con Me Gusta -->
  <div class="pt-3 border-t border-gray-100 flex items-center justify-between mt-auto">
    <button
      type="button"
      (click)="toggleLike()"
      [ngClass]="{
        'text-red-600 bg-red-50 hover:bg-red-100 border-red-200': leGusta,
        'text-gray-600 bg-gray-50 hover:bg-gray-100 border-gray-200': !leGusta
      }"
      class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full border text-sm font-medium transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 transition-transform active:scale-125"
        [ngClass]="{ 'fill-red-600 text-red-600': leGusta, 'fill-none text-gray-500': !leGusta }"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
        />
      </svg>
      <span>{{ publicacion.likes }} {{ publicacion.likes === 1 ? 'me gusta' : 'me gusta' }}</span>
    </button>
  </div>
</article>
