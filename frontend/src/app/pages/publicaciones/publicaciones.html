<div class="max-w-4xl mx-auto px-4 py-8">
  <!-- Cabecera de la sección y Filtros de Ordenamiento -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Publicaciones</h1>
      <p class="text-sm text-gray-500 mt-1">Explorá las publicaciones de la comunidad</p>
    </div>

    <!-- Controles de ordenamiento -->
    <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
      <button
        type="button"
        (click)="cambiarOrden('fecha')"
        [ngClass]="{
          'bg-blue-600 text-white shadow-sm': criterioOrden === 'fecha',
          'text-gray-600 hover:text-gray-900': criterioOrden !== 'fecha'
        }"
        class="px-4 py-2 text-sm font-medium rounded-md transition-colors flex items-center space-x-1.5"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Más recientes</span>
      </button>

      <button
        type="button"
        (click)="cambiarOrden('likes')"
        [ngClass]="{
          'bg-blue-600 text-white shadow-sm': criterioOrden === 'likes',
          'text-gray-600 hover:text-gray-900': criterioOrden !== 'likes'
        }"
        class="px-4 py-2 text-sm font-medium rounded-md transition-colors flex items-center space-x-1.5"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
        <span>Más populares</span>
      </button>
    </div>
  </div>

  <!-- Estado de carga -->
  <div *ngIf="cargando" class="flex flex-col items-center justify-center py-16 text-gray-500">
    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-sm">Cargando publicaciones...</p>
  </div>

  <!-- Estado vacío -->
  <div *ngIf="!cargando && publicaciones.length === 0" class="text-center py-16 bg-white rounded-xl border border-gray-200 p-8 shadow-sm">
    <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
    </svg>
    <h3 class="text-base font-semibold text-gray-900">No hay publicaciones</h3>
    <p class="text-sm text-gray-500 mt-1">No se encontraron publicaciones en esta sección.</p>
  </div>

  <!-- Listado de Publicaciones -->
  <div *ngIf="!cargando && publicaciones.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <app-publicacion
      *ngFor="let pub of publicaciones"
      [publicacion]="pub"
      [usuarioActual]="usuarioActual"
      [leGusta]="estaLikeada(pub._id)"
      (like)="onDarLike($event)"
      (quitarLike)="onQuitarLike($event)"
      (eliminar)="onEliminar($event)"
    />
  </div>

  <!-- Paginación -->
  <div *ngIf="!cargando && (publicaciones.length > 0 || paginaActual > 1)" class="mt-10 flex items-center justify-between border-t border-gray-200 pt-6">
    <button
      type="button"
      (click)="paginaAnterior()"
      [disabled]="paginaActual <= 1 || cargando"
      class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Anterior
    </button>

    <span class="text-sm text-gray-600 font-medium">
      Página {{ paginaActual }}
    </span>

    <button
      type="button"
      (click)="paginaSiguiente()"
      [disabled]="!hayMasPublicaciones || cargando"
      class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
    >
      Siguiente
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
