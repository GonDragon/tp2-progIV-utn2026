<div class="xp-window gestion-usuarios-window">
  <!-- Barra de Título estilo Windows XP -->
  <div class="xp-titlebar">
    <div class="xp-titlebar-title">
      <img src="/img/iconos/usuarios.png" alt="Gestión de usuarios" class="xp-titlebar-icon" />
      <span>Gestión de usuarios</span>
    </div>
    <div class="xp-window-controls">
      <button type="button" class="xp-win-btn xp-win-btn-default" title="Minimizar">_</button>
      <button type="button" class="xp-win-btn xp-win-btn-default" title="Maximizar">□</button>
      <button type="button" class="xp-win-btn xp-win-btn-close" (click)="cerrarVentana()" title="Cerrar">✕</button>
    </div>
  </div>

  <!-- Pestañas de la ventana -->
  <div class="gestion-usuarios-tabs">
    <div class="xp-tab-container">
      <button
        type="button"
        class="xp-tab-button"
        [class.active]="tabActiva === 'lista'"
        (click)="cambiarTab('lista')"
      >
        <img src="/img/iconos/lista-usuarios.png" alt="Lista de usuarios" class="xp-tab-icon" />
        <span>Lista de usuarios</span>
      </button>

      <button
        type="button"
        class="xp-tab-button"
        [class.active]="tabActiva === 'alta'"
        (click)="cambiarTab('alta')"
      >
        <img src="/img/iconos/alta-usuario.png" alt="Alta de usuarios" class="xp-tab-icon" />
        <span>Alta de usuarios</span>
      </button>
    </div>
  </div>

  <!-- Contenido de la ventana -->
  <div class="xp-window-content">
    <app-lista-usuarios *ngIf="tabActiva === 'lista'"></app-lista-usuarios>
    <app-alta-usuario *ngIf="tabActiva === 'alta'"></app-alta-usuario>
  </div>
</div>
