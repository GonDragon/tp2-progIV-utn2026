# ==========================================
# 1. BLOQUE LOCALHOST (HTTP Normal)
# ==========================================
server {
    listen 80;
    # Atrapa exclusivamente las peticiones locales (o por IP local)
    server_name localhost 127.0.0.1;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==========================================
# 2. BLOQUE DOMINIO - REDIRECCIÓN HTTP -> HTTPS
# ==========================================
server {
    listen 80;
    # Atrapa exclusivamente las peticiones al dominio por el puerto 80
    server_name tp2.gondragon.com.ar;

    # Fuerza la redirección a HTTPS
    return 301 https://$host$request_uri;
}

# ==========================================
# 3. BLOQUE DOMINIO - HTTPS
# ==========================================
server {
    listen 443 ssl;
    server_name tp2.gondragon.com.ar;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
